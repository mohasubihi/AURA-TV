<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<title>AURA / CINEMA</title>
<style>
:root{--accent:#ff354c;--rgb:255,53,76;--text:#fff5f3;--dim:#c9c5c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0811;color:var(--text);font-family:Arial,'Noto Sans Arabic','Segoe UI',sans-serif}
body{position:relative;user-select:none;-webkit-user-select:none;}
.wallpaper{position:fixed;inset:0;background:url('scene_3840.webp') center center/cover no-repeat;transform:scale(1.003);z-index:0}
.tone{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(4,5,13,.44) 0%,rgba(9,5,16,.1) 26%,rgba(3,5,12,.10) 54%,rgba(2,4,13,.12) 67%,rgba(1,3,9,.32) 100%),linear-gradient(90deg,rgba(3,5,12,.21),transparent 27%,transparent 77%,rgba(4,5,12,.17));}
.stage-light{position:fixed;z-index:2;pointer-events:none;inset:22% 0 12%;background:radial-gradient(ellipse 25% 28% at 50% 69%,rgba(var(--rgb),.23),transparent 80%);mix-blend-mode:screen;transition:background .35s}
.ui{position:absolute;inset:0;z-index:3}
.topbar{height:14.1%;display:flex;direction:ltr;align-items:flex-start;padding:3.1vh 4.8vw 0 4.7vw;justify-content:space-between;gap:3vw}
.brand{text-align:left;direction:ltr;line-height:1;padding-top:1.1vh;flex:0 0 20%;filter:drop-shadow(0 2px 16px rgba(0,0,0,.5))}
.brand-main{font-size:clamp(24px,2.25vw,52px);letter-spacing:.31em;font-weight:300;color:#fff4ee}.brand-main b{font-weight:200;color:#fcbf98;letter-spacing:.06em;font-size:60%;vertical-align:10%}
.brand-line{height:2px;width:10.2vw;margin-top:1vh;background:linear-gradient(90deg,rgba(255,179,92,.82),rgba(248,71,102,.95),transparent);box-shadow:0 0 13px rgba(246,74,92,.5)}
.nav{display:flex;direction:rtl;justify-content:center;align-items:center;gap:1.05vw;padding-top:.5vh;flex:1}
.navitem{height:5.7vh;min-width:9.5vw;padding:0 1.25vw;border:1px solid transparent;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:.75vw;white-space:nowrap;font-size:clamp(12px,1vw,23px);color:#ddd7dc;text-shadow:0 1px 4px #171018;transition:all .26s}
.navitem svg{height:1.25vw;width:1.25vw;min-height:16px;min-width:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}
.navitem.active,.navitem.remote{color:white;background:linear-gradient(180deg,rgba(77,56,82,.76),rgba(22,23,40,.82));border-color:rgba(255,213,209,.54);box-shadow:0 0 0 1px rgba(255,98,104,.25),inset 0 1px 1px rgba(255,255,255,.34),0 0 22px rgba(255,60,102,.3)}
.navitem.remote{outline:2px solid rgba(255,248,246,.78)}
.meta{display:flex;direction:rtl;align-items:center;gap:1.2vw;padding-top:.25vh;white-space:nowrap;flex:0 0 23%;justify-content:flex-start}
#clock{font-size:clamp(24px,2.15vw,50px);font-weight:500;letter-spacing:.01em;direction:ltr;line-height:1.15}
.meta-detail{font-size:clamp(11px,.9vw,21px);text-align:right;line-height:1.75;font-weight:500;color:#f2e8ec;text-shadow:0 2px 7px rgba(0,0,0,.7)}
.metaline{height:4.4vh;width:1px;background:rgba(255,228,227,.49)}
.meta-network{font-size:clamp(11px,.86vw,19px);color:#d3efea}
.meta-network b{color:#93fae9}
/* Horizontal cinema strip: a single luminous focus, and five integrated glass-panels */
.carousel{position:absolute;left:3%;right:3%;top:34.7%;height:34.7%;perspective:1500px;z-index:4;pointer-events:none}
.tile{--x:0vw;--s:1;--ry:0deg;--op:1;--layer:2;--card:255,68,102;position:absolute;top:50%;left:50%;width:15.5vw;height:23.9vh;transform:translate(-50%,-50%) translateX(var(--x)) rotateY(var(--ry)) scale(var(--s));opacity:var(--op);z-index:var(--layer);overflow:hidden;pointer-events:auto;isolation:isolate;transform-style:preserve-3d;background:linear-gradient(153deg,rgba(21,17,32,.94),rgba(12,12,25,.97) 48%,rgba(13,14,31,.94));border:1.4px solid rgba(255,239,233,.4);border-radius:1.35vw;box-shadow:0 21px 48px rgba(1,2,11,.62),inset 0 1.2px 0 rgba(255,255,255,.23),inset -2px -2px 15px rgba(0,0,0,.25);transition:transform .57s cubic-bezier(.2,.78,.18,1),opacity .43s,border-color .35s,box-shadow .35s;outline:none}
.tile:before{content:'';position:absolute;inset:-15% -9% -30%;z-index:-1;background:radial-gradient(ellipse at 22% 97%,rgba(var(--card),.86),transparent 31%),radial-gradient(ellipse at 85% 96%,rgba(var(--card),.63),transparent 41%),radial-gradient(ellipse at 90% 4%,rgba(var(--card),.17),transparent 52%);}
.tile:after{content:'';position:absolute;left:-24%;right:-25%;bottom:-10%;height:43%;border-top:2px solid rgba(var(--card),.74);border-radius:52% 47% 0 0;transform:skewY(-10deg);box-shadow:0 -5px 18px rgba(var(--card),.23),0 -20px 70px rgba(var(--card),.15);pointer-events:none;}
.tile .shine{position:absolute;left:0;right:0;top:0;height:38%;background:linear-gradient(125deg,rgba(255,255,255,.09),transparent 43%);pointer-events:none}
.tile.selected{border:2.2px solid rgba(255,194,164,.96);box-shadow:0 0 0 1px rgba(255,73,105,.72),0 0 20px rgba(var(--card),.55),0 0 65px rgba(var(--card),.30),0 25px 68px rgba(0,0,0,.54),inset 0 1px 1px rgba(255,255,255,.46)}
.tile.remote{outline:2px solid white;outline-offset:4px}
.wordmark{height:100%;display:flex;justify-content:center;align-items:center;text-align:center;flex-direction:column;padding:0 5% 6%;color:white;direction:ltr;transform:translateY(-1%)}
.wm-word{font-size:clamp(20px,2.1vw,46px);font-weight:750;letter-spacing:-.035em;line-height:1.12;text-shadow:0 6px 16px rgba(0,0,0,.42)}
.selected .wm-word{font-size:clamp(34px,3.45vw,80px)}
.wm-word.netflix{font-family:Arial,sans-serif;letter-spacing:-.055em;color:#fa1038;font-stretch:condensed;font-weight:900}
.wm-word.youtube{display:flex;gap:.45vw;align-items:center;font-size:clamp(19px,1.7vw,41px);letter-spacing:-.06em;font-weight:750}
.selected .wm-word.youtube{font-size:clamp(27px,2.6vw,60px)}
.play-icon{display:inline-flex;align-items:center;justify-content:center;width:3.1vw;height:2.25vw;border-radius:.66vw;background:#f41134;font-size:1.12vw;font-weight:bold;color:white;box-shadow:0 0 15px rgba(255,0,54,.25)}
.wm-word.music{color:#f6eaf6;font-weight:650;font-size:clamp(16px,1.36vw,34px);letter-spacing:-.035em}
.music-circle{display:inline-flex;align-items:center;justify-content:center;border:2px solid #fa2457;border-radius:50%;width:2.6vw;height:2.6vw;color:#ff496f;font-size:1.28vw;margin-bottom:1vw}
.wm-word.disney{font-family:Georgia,serif;font-style:italic;color:#f2f9ff;text-shadow:0 0 20px #258fff}
.wm-word.shahid{font-weight:700;letter-spacing:-.025em;color:#fff}
.shahid-dots{display:flex;gap:.4vw;margin-bottom:.8vw}.shahid-dots i{display:block;width:.55vw;height:.55vw;background:#00d8a1;border-radius:50%}
.wm-word.prime{font-size:clamp(21px,1.7vw,42px);color:#d1f3ff}
.wm-word.fallback{font-size:clamp(18px,1.5vw,34px);letter-spacing:0}
.wm-image{width:4.5vw;height:4.5vw;object-fit:contain;max-width:80%;border-radius:.6vw;filter:drop-shadow(0 6px 14px rgba(0,0,0,.26));margin-bottom:.6vw}
.selected .wm-image{width:5.9vw;height:5.9vw}
.wm-sub{position:absolute;bottom:12%;right:0;left:0;text-align:center;color:#e8dde5;opacity:.9;font-size:clamp(9px,.72vw,17px);direction:rtl;font-weight:600}
.selected .wm-sub{font-size:clamp(12px,.95vw,21px);bottom:9%}
.wm-corner{position:absolute;top:7%;right:8%;font-family:Arial,sans-serif;color:rgba(255,255,255,.48);letter-spacing:.23em;font-size:clamp(7px,.56vw,12px)}
/* Dock is functional: system actions, not fake recent-watch content */
.dock{position:absolute;left:26%;right:3.8%;bottom:8.1%;height:12.7%;z-index:5;padding:1.35vh 1.45vw;display:flex;direction:rtl;align-items:center;gap:1.25vw;border:1px solid rgba(226,212,223,.20);background:linear-gradient(110deg,rgba(17,15,36,.83),rgba(30,28,45,.67));border-radius:1.5vw;box-shadow:0 16px 55px rgba(0,0,0,.38),inset 0 1px 1px rgba(255,255,255,.13);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.docktitle{padding:0 .65vw 0 1.1vw;min-width:9.5vw;border-left:1px solid rgba(255,255,255,.22);height:60%;display:flex;align-items:center;text-align:right;font-size:clamp(11px,.92vw,20px);font-weight:600;line-height:1.55}
.dockitem{height:100%;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.45vw;border-radius:.9vw;border:1px solid transparent;background:rgba(255,255,255,.045);font-size:clamp(10px,.78vw,17px);color:#efeaf1;text-align:center;transition:.23s}
.dockitem svg{height:2vw;width:2vw;min-width:23px;min-height:23px;fill:none;stroke-width:1.65;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.dockitem.remote{background:rgba(var(--rgb),.21);border-color:rgba(255,255,255,.87);box-shadow:0 0 18px rgba(var(--rgb),.3)}
.hint{position:absolute;bottom:1.7%;left:4.2%;font-family:Arial,sans-serif;direction:ltr;letter-spacing:.21em;font-size:clamp(8px,.64vw,15px);color:rgba(255,241,230,.54)}
.focuslabel{position:absolute;left:50%;top:73.7%;transform:translateX(-50%);z-index:5;text-align:center;white-space:nowrap;pointer-events:none;color:#fff2f2;font-size:clamp(12px,1.05vw,24px);text-shadow:0 3px 12px #000}
.focuslabel strong{font-weight:650}
.sidehint{position:absolute;right:4.3%;top:30%;font-size:clamp(12px,.86vw,19px);color:rgba(255,243,240,.66);text-shadow:0 2px 8px black;text-align:right;line-height:2.4}
@media(max-aspect-ratio:1.6){.tile{width:18vw}.dock{left:19%}.navitem{min-width:8vw}}
</style>
</head>
<body>
<div class="wallpaper"></div><div class="tone"></div><div class="stage-light"></div>
<div class="ui">
<header class="topbar">
 <div class="brand"><div class="brand-main">AURA <b>OS</b></div><div class="brand-line"></div></div>
 <nav class="nav"><div class="navitem active" id="nav-home">الرئيسية <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9H4v-9"/><path d="M9 20v-7h6v7"/></svg></div><div class="navitem" id="nav-apps">التطبيقات <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div class="navitem" id="nav-settings">الإعدادات <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2l2 2 3-.3.4 3L20 9l-1 3 1 3-2.6 2.3-.4 3L14 20l-2 2-2-2-3 .3-.4-3L4 15l1-3-1-3 2.6-2.3.4-3L10 4z"/></svg></div></nav>
 <div class="meta"><div id="clock">23:10</div><div class="metaline"></div><div class="meta-detail"><div id="date">الأحد، 15 نوفمبر</div><div id="period">مساء هادئ</div></div><div class="metaline"></div><div class="meta-network" id="network"><b>●</b> متصل</div></div>
</header>
<div class="sidehint">اختر ما تحب<br>واضغط OK للتشغيل</div>
<div class="carousel" id="carousel"></div>
<div class="focuslabel"><strong id="focus-name">Netflix</strong> <span style="opacity:.74">· اضغط OK</span></div>
<div class="dock" id="dock"><div class="docktitle">مساحتك<br> الخاصة</div>
  <div class="dockitem" id="dock-all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>كل التطبيقات</div>
  <div class="dockitem" id="dock-network"><svg viewBox="0 0 24 24"><path d="M2 9a16 16 0 0 1 20 0M5 13a11 11 0 0 1 14 0M9 17a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1"/></svg>الشبكة</div>
  <div class="dockitem" id="dock-settings"><svg viewBox="0 0 24 24"><path d="M12 2l2 2 3-.3.4 3L20 9l-1 3 1 3-2.6 2.3-.4 3L14 20l-2 2-3 .3-.4-3L4 15l1-3-1-3 2.6-2.3.4-3L10 4z"/><circle cx="12" cy="12" r="3"/></svg>الإعدادات</div>
  <div class="dockitem" id="dock-home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9H4v-9"/><path d="M9 20v-7h6v7"/></svg>الرئيسية</div>
</div>
<div class="hint">AURA CINEMA / INTERACTIVE HOME</div>
</div>
<script>
(function(){'use strict';
let apps=[{id:'com.netflix.ninja',name:'Netflix',icon:null},{id:'com.google.android.youtube.tv',name:'YouTube',icon:null},{id:'com.google.android.youtube.music',name:'YouTube Music',icon:null},{id:'com.disney.disneyplus',name:'Disney+',icon:null},{id:'com.shahid',name:'MBC Shahid',icon:null},{id:'__all__',name:'كل التطبيقات',icon:null}];
let current=0,zone='carousel',nav=0,dock=0;
const p=document.documentElement;
const palette={netflix:['255,42,73','#ff2c48'],youtube:['255,71,76','#ff4754'],music:['251,61,130','#fb3d82'],disney:['40,166,255','#28a6ff'],shahid:['24,225,177','#18e1b1'],prime:['55,180,252','#37b4fc'],all:['184,163,255','#b8a3ff'],default:['128,165,249','#80a5f9']};
function brand(a){const key=((a.id||'')+' '+(a.name||'')).toLowerCase();if(a.id==='__all__')return ['all',`<div class="wm-word fallback">＋</div>`];if(key.includes('netflix'))return ['netflix','<div class="wm-word netflix">NETFLIX</div>'];if(key.includes('youtube')&&key.includes('music'))return ['music','<div class="music-circle">▶</div><div class="wm-word music">YouTube Music</div>'];if(key.includes('youtube'))return ['youtube','<div class="wm-word youtube"><span class="play-icon">▶</span> YouTube</div>'];if(key.includes('disney'))return ['disney','<div class="wm-word disney">Disney+</div>'];if(key.includes('shahid')||key.includes('mbc'))return ['shahid','<div class="shahid-dots"><i></i><i></i><i></i><i></i></div><div class="wm-word shahid">mbc<br>shahid</div>'];if(key.includes('prime'))return ['prime','<div class="wm-word prime">prime video</div>'];if(a.icon&&a.icon.startsWith('data:image/'))return ['default',`<img class="wm-image" alt="" src="${a.icon}"><div class="wm-word fallback">${escapeText(a.name)}</div>`];return ['default',`<div class="wm-word fallback">${escapeText(a.name)}</div>`]}
function escapeText(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
const pos={ '-2':[-34.5,.84,20, 0.95],'-1':[-18.7,.97,11,1], '0':[0,1.35,0,1], '1':[18.7,.97,-11,1], '2':[34.5,.84,-20,.95]};
function render(){const host=document.getElementById('carousel');host.innerHTML='';const n=apps.length;for(let i=-2;i<=2;i++){let idx=(current+i+n)%n;const a=apps[idx];const [brandKey,visual]=brand(a);const [x,scale,rotate,op]=pos[String(i)];const cols=palette[brandKey]||palette.default;let tile=document.createElement('div');tile.className='tile'+(i===0?' selected':'');tile.style.cssText=`--x:${x}vw;--s:${scale};--ry:${rotate}deg;--op:${op};--layer:${10-Math.abs(i)};--card:${cols[0]}`;tile.innerHTML=`<span class="wm-corner">AURA / ${String(idx+1).padStart(2,'0')}</span><div class="shine"></div><div class="wordmark">${visual}</div><span class="wm-sub">${i===0?'افتح التطبيق  ◁':''}</span>`;host.appendChild(tile);tile.addEventListener('click',()=>{if(i===0)activate();else{current=idx;render()}})}const selected=apps[current];const [brandKey]=brand(selected);const cols=palette[brandKey]||palette.default;p.style.setProperty('--rgb',cols[0]);p.style.setProperty('--accent',cols[1]);document.getElementById('focus-name').textContent=selected.name;updateZone()}
function move(d){if(zone==='carousel'){current=(current+d+apps.length)%apps.length;render()}else if(zone==='nav'){nav=(nav+d+3)%3;updateZone()}else{dock=(dock+d+4)%4;updateZone()}}
function updateZone(){document.querySelectorAll('.remote').forEach(n=>n.classList.remove('remote'));if(zone==='nav')document.querySelectorAll('.navitem')[nav].classList.add('remote');if(zone==='dock')document.querySelectorAll('.dockitem')[dock].classList.add('remote');if(zone==='carousel')document.querySelector('.tile.selected')?.classList.add('remote')}
function all(){if(window.Aura)window.Aura.launch('__all__')}
function settings(){if(window.Aura&&window.Aura.openSettings)window.Aura.openSettings()}
function network(){if(window.Aura&&window.Aura.openNetwork)window.Aura.openNetwork();else settings()}
function activate(){if(zone==='nav'){[()=>{},all,settings][nav]();return}if(zone==='dock'){[all,network,settings,()=>{zone='carousel';updateZone()}][dock]();return}const a=apps[current];if(window.Aura&&a)try{window.Aura.launch(a.id)}catch(e){}}
window.onRemote=function(k){if(k==='left')move(-1);else if(k==='right')move(1);else if(k==='up'){zone='nav';updateZone()}else if(k==='down'){zone='dock';updateZone()}else if(k==='enter')activate();else if(k==='back'){zone='carousel';updateZone()}};
window.setApps=function(json){try{const arr=typeof json==='string'?JSON.parse(json):json;if(Array.isArray(arr)&&arr.length){apps=arr.map(a=>({id:a.id,name:a.name,icon:a.icon||null}));current=Math.max(0,apps.findIndex(a=>(a.id||" ").toLowerCase().includes("netflix")));render()}}catch(e){}};
window.setNetwork=function(connected){document.getElementById('network').innerHTML=connected?'<b>●</b> متصل':'<b style="color:#e9a1a1">●</b> غير متصل'};
function clock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'});let h=d.getHours();document.getElementById('period').textContent=h<12?'صباح جميل':h<18?'نهار سعيد':'مساء هادئ';}
for(let id of ['nav-home','dock-home'])document.getElementById(id).addEventListener('click',()=>{zone='carousel';updateZone()});for(let id of ['nav-apps','dock-all'])document.getElementById(id).addEventListener('click',all);for(let id of ['nav-settings','dock-settings'])document.getElementById(id).addEventListener('click',settings);document.getElementById('dock-network').addEventListener('click',network);
document.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'enter',' ':'enter',Escape:'back'}[e.key];if(k){e.preventDefault();window.onRemote(k)}});let touchX=null;document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>42){zone='carousel';move(dx>0?-1:1)}touchX=null},{passive:true});
clock();setInterval(clock,30000);render();window.addEventListener('load',()=>{if(window.Aura){try{let r=window.Aura.getApps();if(r)window.setApps(r)}catch(e){}}});
})();
</script>
</body>
</html>
