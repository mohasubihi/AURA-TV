<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AURA NOVA</title>
<style>
:root { --accent: #b78afb; --accent-rgb: 183,138,251; --foreground:#f8f6fb; --muted:#c0c1dc; --night:#061025; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; width:100%;height:100%; overflow:hidden; font-family:'Noto Sans Arabic','Segoe UI',Arial,sans-serif; color:var(--foreground); background:#050c19; }
body { perspective:1400px; }
.scene, .ambient, .shade, .ui { position:absolute; inset:0; width:100%;height:100%; }
.scene { z-index:0; }
.ambient { z-index:1; pointer-events:none; background: radial-gradient(ellipse 65% 35% at 51% 72%,rgba(var(--accent-rgb),.23),transparent 70%),linear-gradient(to top,#060914 0%,rgba(2,6,15,.22) 22%,transparent 51%); mix-blend-mode:screen; transition:background .8s; }
.shade { z-index:2; pointer-events:none; background:linear-gradient(90deg,rgba(3,6,17,.45) 0%,transparent 28%,transparent 78%,rgba(3,6,17,.20) 100%),linear-gradient(180deg,rgba(1,4,13,.35) 0%,rgba(1,4,13,.08) 27%,transparent 60%,rgba(1,5,15,.55) 100%); }
.ui { z-index:4; padding:2.7vh 4.6vw 4.5vh; }
.header { direction:ltr; display:flex; justify-content:space-between; align-items:flex-start; width:100%; height:11vh; }
.brand { text-align:left; direction:ltr; padding-top:1.1vh; }
.brand-main { font-family:Arial,sans-serif; font-size:clamp(24px,2.5vw,56px); font-weight:200;letter-spacing:.32em; line-height:1; color:#f4edfd; text-shadow:0 0 35px rgba(192,151,254,.18); }
.brand-sub { font-family:Arial,sans-serif; font-size:clamp(8px,.67vw,14px); letter-spacing:.5em; color:#b8a9d0; margin-top:1vh; }
.brand-line {height:2px;width:8vw;background:linear-gradient(90deg,rgba(130,210,255,.7),#bb90fb,transparent);margin-top:1.65vh;border-radius:100%;}
.info { direction:rtl; display:flex;align-items:center;gap:1.5vw; padding-top:.45vh; color:#f8f3ff; }
.clock { direction:ltr; font-size:clamp(23px,2.45vw,55px);font-weight:300; letter-spacing:.03em;line-height:1;}
.clock-details { font-size:clamp(10px,.85vw,19px); line-height:1.9; color:#b8c0d4;text-align:right; }
.info .hairline { height:4.2vh;width:1px;background:rgba(255,255,255,.25);}
.status {font-size:clamp(11px,.85vw,20px);color:#c6d4e6;}
.status span {color:#88e5dd;}
.headline { position:absolute; top:17.4vh; right:6vw; text-align:right;z-index:2; }
.eyebrow {font-size:clamp(10px,.78vw,18px); color:#d0b5ee; font-weight:600;letter-spacing:.15em; }
.heading {font-size:clamp(36px,4.05vw,83px);font-weight:450;line-height:1.43; letter-spacing:-.018em;margin:1.1vh 0 .1vh; text-shadow:0 7px 35px rgba(2,2,9,.7);}
.heading em {font-style:normal;background:linear-gradient(90deg,#f5ecff,#dcc0fe 45%,#8ce5f6);-webkit-background-clip:text;background-clip:text;color:transparent;}
.subheading {font-size:clamp(14px,1.22vw,27px);color:#bac4d5;letter-spacing:.01em;}
.motif {width:8vw;height:2px;margin:2.5vh 0 0 auto;background:linear-gradient(270deg,var(--accent),rgba(92,221,244,.22),transparent);box-shadow:0 0 16px var(--accent);}
.orbit-caption {position:absolute;top:32vh;left:8vw;text-align:left;direction:ltr;font-family:Arial,sans-serif;letter-spacing:.22em;color:#c6cae8;font-size:clamp(10px,.79vw,18px);opacity:.7;}
.carousel {position:absolute;inset:0;z-index:5;pointer-events:none;}
.card { --x:0vw; --y:0vh;--r:0deg;--sc:1;--a:1; position:absolute;pointer-events:auto;left:50%;top:62%;width:18vw;height:34vh; min-height:140px; border-radius:2.15vw; transform-style:preserve-3d; transform:translate(-50%,-50%) translateX(var(--x)) translateY(var(--y)) rotateY(var(--r)) scale(var(--sc)); opacity:var(--a);transition:transform .75s cubic-bezier(.2,.8,.1,1),opacity .55s,border-color .5s,filter .5s,box-shadow .5s; overflow:hidden; isolation:isolate; border:1.1px solid rgba(214,223,255,.29);background:linear-gradient(146deg,rgba(46,64,100,.86) 0%,rgba(14,18,48,.90) 39%,rgba(7,12,30,.94) 100%); box-shadow:0 30px 90px rgba(0,0,0,.50),inset 1px 1px 0 rgba(255,255,255,.19),inset -4px -6px 22px rgba(0,0,0,.25);outline:none;}
.card:before { content:"";z-index:-1;position:absolute;inset:-25%;background: radial-gradient(circle at 40% 83%, rgba(var(--card-rgb),.80),transparent 30%), radial-gradient(ellipse at 92% 16%,rgba(var(--card-rgb),.38),transparent 45%),conic-gradient(from 42deg at 75% 65%,transparent 0%,rgba(var(--card-rgb),.19) 18%,transparent 39%,rgba(148,190,250,.13) 64%,transparent 90%);transform:rotate(-12deg);filter:blur(2px);}
.card:after {content:"";position:absolute;inset:-50% -30%;z-index:-1;background:linear-gradient(127deg,transparent 37%,rgba(255,255,255,.10) 47%,transparent 55%);transform:translateX(-25%) rotate(15deg);}
.card.selected {filter:saturate(1.25);border:2px solid rgba(251,225,252,.92);box-shadow:0 0 0 1px rgba(148,215,255,.37),0 0 40px rgba(var(--accent-rgb),.42),0 28px 98px rgba(0,0,0,.63),inset 0 0 33px rgba(var(--accent-rgb),.13),inset 1px 1px 0 rgba(255,255,255,.44);}
.card .card-top {position:absolute;top:5%;right:7%;font-family:Arial,sans-serif;font-size:clamp(8px,.7vw,15px);color:rgba(236,238,255,.5);direction:ltr;letter-spacing:.3em;}
.card .globe {position:absolute;inset:12% 13% 24%;border-radius:50%;background:radial-gradient(circle at 32% 21%,rgba(255,255,255,.22),transparent 23%),radial-gradient(circle at 54% 63%,rgba(var(--card-rgb),.5),transparent 55%),radial-gradient(circle at 65% 85%,rgba(0,3,12,.65),transparent 60%);border:1px solid rgba(227,230,255,.12);box-shadow:inset -2vw -1vw 3vw rgba(0,0,0,.44),0 0 5vw rgba(var(--card-rgb),.23);}
.card .app-logo {position:absolute;top:28%;left:50%;width:5.9vw;height:5.9vw;max-height:12vh;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 .6vw 1.5vw rgba(0,0,0,.52));}
.card .app-fallback {position:absolute;top:27%;width:100%;text-align:center;font-size:clamp(38px,5vw,98px);font-weight:650;color:#fff;line-height:1.4;}
.card .app-name {position:absolute;bottom:13.7%;width:100%;padding:0 8%;font-size:clamp(14px,1.45vw,32px);text-align:center;font-weight:600;text-shadow:0 4px 15px #030516;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .app-caption {position:absolute;bottom:7%;width:100%;text-align:center;font-size:clamp(8px,.65vw,16px);color:#c9cde5;letter-spacing:.13em;font-family:Arial,sans-serif;}
.card .edge-glint {position:absolute;left:10%;bottom:0;width:80%;height:2px;background:linear-gradient(90deg,transparent,rgba(var(--card-rgb),.85),transparent);box-shadow:0 0 20px rgba(var(--card-rgb),.85);}
.selected .app-logo {width:6.8vw;height:6.8vw;}
.focus-title {position:absolute;bottom:12.8vh;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;z-index:6;pointer-events:none;}
.focus-name {font-size:clamp(18px,1.7vw,35px);font-weight:500;text-shadow:0 4px 30px black;}
.focus-hint {margin-top:.6vh;color:#d3cfe1;font-size:clamp(11px,.9vw,20px);}
.bottom {position:absolute;bottom:4.3vh;left:50%;transform:translateX(-50%);width:44vw;height:6.2vh;z-index:8;display:flex;gap:2vw;justify-content:center;align-items:center;direction:ltr;border:1px solid rgba(222,228,255,.22);background:linear-gradient(90deg,rgba(9,18,40,.55),rgba(31,38,69,.55),rgba(9,18,40,.55));backdrop-filter:blur(24px);border-radius:50px;box-shadow:0 7px 35px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12);}
.dot {width:.6vw;height:.6vw;min-width:5px;min-height:5px;background:rgba(196,203,224,.4);border-radius:100px;transition:background .4s,transform .4s;}
.dot.on {background:#b5f1fe;box-shadow:0 0 20px rgba(109,233,255,.8);transform:scale(1.5);}
.bottom strong {font-size:clamp(11px,.9vw,21px);font-weight:500;color:#cbd5e6;letter-spacing:.01em;}
.bottom .divider {height:2.5vh;width:1px;background:rgba(255,255,255,.23);}
.demo-only {position:absolute;bottom:1.3vh;left:4.5vw;font-family:Arial,sans-serif;font-size:clamp(7px,.58vw,13px);color:rgba(220,221,239,.45);direction:ltr;letter-spacing:.14em;}
body.day .shade {background:linear-gradient(180deg,rgba(1,4,13,.15),rgba(2,4,14,.2) 70%,rgba(1,4,13,.44));}
@media (max-aspect-ratio: 1.6) {.headline{top:17vh}.heading{font-size:4vw}.card{height:30vh}.bottom{bottom:4vh}.focus-title{bottom:13vh} }

 ];
